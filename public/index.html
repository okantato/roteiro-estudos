<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roteiro de estudos</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<section id="auth" hidden>
  <h1>Roteiro de estudos</h1>
  <div class="card">
    <input id="em" type="email" placeholder="E-mail" autocomplete="username" maxlength="120">
    <input id="pw" type="password" placeholder="Senha (mínimo 10 caracteres)" autocomplete="current-password" maxlength="100">
    <p id="err" role="alert"></p>
    <div class="acts"><button id="login" class="pri">Entrar</button><button id="reg">Criar conta</button></div>
  </div>
</section>

<main id="app" hidden>
  <div class="top">
    <input id="title" maxlength="120" aria-label="Título do roteiro" placeholder="Tema do roteiro">
    <span id="who"></span><button id="out">Sair</button>
  </div>
  <div class="bar"><i id="fill"></i></div>
  <div class="stat"><span id="count"></span><span id="pct"></span><span id="st"></span></div>
  <div class="tools">
    <button id="add" class="pri">+ Adicionar dia</button>
    <button id="blank">Modelo em branco</button>
    <button id="ex">Exemplo: 14 dias</button>
    <button id="rst" class="del">Desmarcar tudo</button>
    <button id="exp">Exportar / importar</button>
  </div>
  <div id="io" hidden>
    <textarea id="json" aria-label="JSON do roteiro"></textarea>
    <div class="tools"><button id="imp" class="pri">Importar JSON</button></div>
  </div>
  <div id="list"></div>
</main>

<script src="/vendor/gsap/gsap.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
